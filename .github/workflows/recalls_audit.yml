name: Recall coverage audit (openFDA)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: python scripts/recalls_fetch.py
      - run: python scripts/recalls_audit.py
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recalls/us_drug_recalls.jsonl data/reports/recalls_audit.json
          git diff --cached --quiet && exit 0
          git commit -m "recalls: refetch + coverage audit $(date -u +%F)"
          git pull --rebase origin main && git push origin HEAD:main
