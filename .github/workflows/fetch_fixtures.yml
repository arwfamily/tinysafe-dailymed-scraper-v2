name: Fetch SPL XML test fixtures
on:
  workflow_dispatch:
    inputs:
      setids:
        description: 'space-separated setids'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download SPL XML
        run: |
          mkdir -p tests/fixtures/spl
          for s in ${{ github.event.inputs.setids }}; do
            curl -fsSL -A "TinySafe-research/1.0 (contact: support@tinysafe.app)" \
              "https://dailymed.nlm.nih.gov/dailymed/services/v2/spls/$s.xml" -o "tests/fixtures/spl/$s.xml" || echo "failed $s"
            sleep 1
          done
          ls -la tests/fixtures/spl
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/spl
          git diff --cached --quiet && exit 0
          git commit -m "tests: SPL XML fixtures"
          git push
