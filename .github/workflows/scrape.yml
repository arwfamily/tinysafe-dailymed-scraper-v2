name: DailyMed Mineral Scraper v2 (ingredient-based)

# Full run  : limit 0  -> snapshot + canonical + formulation history, committed
# Smoke test: limit 10 -> snapshot only. A capped run must NEVER touch canonical
#             or history, or 500 missing products would log as mass delisting.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap setids per UNII (10 = smoke test, 0 = FULL run)'
        required: false
        default: '10'
      parallel:
        description: 'Parallel workers (3-10)'
        required: false
        default: '5'
      verify_strengths:
        description: 'Check every concentration against the Drug Facts panel (slow, refetches XML)'
        required: false
        type: boolean
        default: false
      enumeration_probe:
        description: 'Also measure the blind spot by paging the whole OTC monograph category (slow)'
        required: false
        type: boolean
        default: false
  schedule:
    # Weekly full run, Mondays 09:00 UTC. Reformulation is a slow signal;
    # weekly is enough and keeps the raw snapshot folder from exploding.
    - cron: '0 9 * * 1'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Every script here is standard-library only (verified by import scan).
      # requirements.txt is therefore optional — its absence must not fail a run.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "no requirements.txt — scripts are stdlib-only, continuing"
          fi

      - name: Resolve run mode
        id: mode
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          # scheduled runs have no inputs -> always a full run
          if [ -z "$LIMIT" ]; then LIMIT="0"; fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
          if [ "$LIMIT" = "0" ]; then
            echo "partial_flag=" >> "$GITHUB_OUTPUT"
            echo "MODE: FULL RUN — canonical + history will be updated"
          else
            echo "partial_flag=--partial" >> "$GITHUB_OUTPUT"
            echo "MODE: SMOKE TEST (limit $LIMIT) — snapshot only"
          fi
          echo "run_date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Resolve UV-filter names -> UNII codes from DailyMed's own service.
      # Never hardcoded: a wrong code collects nothing, which is indistinguishable
      # from "this filter isn't used in the US".
      # Downloads the whole /uniis catalogue once and matches locally.
      # Non-fatal by design: if it fails the scraper falls back to mineral-only
      # rather than collecting nothing.
      - name: Resolve UNII codes
        continue-on-error: true
        timeout-minutes: 25
        run: python scripts/resolve_uniis.py

      - name: Run scraper
        run: |
          mkdir -p output
          PAR="${{ github.event.inputs.parallel }}"
          case "$PAR" in ''|*[!0-9]*) PAR=5 ;; esac
          if [ "$PAR" -lt 1 ] || [ "$PAR" -gt 16 ]; then PAR=5; fi
          python scripts/dailymed_scraper.py \
            --limit ${{ steps.mode.outputs.limit }} \
            --parallel "$PAR" \
            --output-dir output

      - name: Snapshot + formulation history
        run: |
          python scripts/snapshot_and_history.py \
            --master output/tinysafe_dailymed_v2_master.json \
            --run-date ${{ steps.mode.outputs.run_date }} \
            ${{ steps.mode.outputs.partial_flag }}

      # The scraper's own filtered file is a derived view, not an asset —
      # regenerate it every run and let it be overwritten.
      - name: Copy derived mineral view
        run: |
          mkdir -p data/views
          cp output/tinysafe_dailymed_v2_mineral_sun.json data/views/mineral_sunscreens.json

      # Find the filters the net does not know about. Pass 1 is free (reads the
      # master we just built). The enumeration probe is opt-in because it pages
      # the entire OTC-monograph category.
      - name: Discover unseeded actives
        if: steps.mode.outputs.limit == '0'
        continue-on-error: true
        timeout-minutes: 45
        run: |
          python scripts/discover_actives.py \
            --master output/tinysafe_dailymed_v2_master.json \
            ${{ github.event.inputs.enumeration_probe == 'true' && '--probe' || '' }}

      # Check every computed concentration against the Drug Facts panel on the
      # same label — two independent statements of one fact. Opt-in because it
      # refetches the SPL XML for each product; non-fatal so a network wobble
      # cannot lose a completed collection.
      - name: Verify strengths against the label panel
        if: steps.mode.outputs.limit == '0' && github.event.inputs.verify_strengths == 'true'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          python scripts/verify_strengths.py \
            --canonical data/canonical/us_sunscreens.jsonl \
            --category sunscreen

      # Answer keys: the things that have a right answer. Derived and disposable —
      # delete data/views and a rerun rebuilds them.
      - name: Fetch recall corpus for the cross-join
        continue-on-error: true
        run: |
          mkdir -p external
          curl -sSL -o external/recalls_full.jsonl \
            https://raw.githubusercontent.com/arwfamily/tinysafe-data/main/recalls_full.jsonl
          wc -l external/recalls_full.jsonl || true

      - name: Build answer keys
        if: steps.mode.outputs.limit == '0'
        run: |
          python scripts/build_answer_keys.py --recalls external/recalls_full.jsonl

      - name: Commit data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "data: dailymed run ${{ steps.mode.outputs.run_date }} (limit=${{ steps.mode.outputs.limit }})"
          # another run may have landed while this one was scraping
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF#refs/heads/}" && break
            echo "rebase attempt $i failed, retrying"; sleep 5
          done
          git push origin HEAD:"${GITHUB_REF#refs/heads/}"

      # Artifacts kept as a convenience download. They expire; the commit does not.
      - name: Upload RAW master
        uses: actions/upload-artifact@v4
        with:
          name: dailymed-v2-master
          path: output/tinysafe_dailymed_v2_master.json
          retention-days: 30

      - name: Upload mineral sunscreen (filtered)
        uses: actions/upload-artifact@v4
        with:
          name: dailymed-v2-mineral-sun
          path: output/tinysafe_dailymed_v2_mineral_sun.json
          retention-days: 30
