name: DailyMed Mineral Scraper v2 (ingredient-based)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Cap setids per UNII (10 = smoke test, 0 = full run)'
        required: false
        default: '10'
      parallel:
        description: 'Parallel workers (3-10)'
        required: false
        default: '5'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          mkdir -p output
          python scripts/dailymed_scraper.py \
            --limit ${{ github.event.inputs.limit }} \
            --parallel ${{ github.event.inputs.parallel }} \
            --output-dir output

      - name: List output
        run: ls -la output/

      - name: Upload RAW master (everything)
        uses: actions/upload-artifact@v4
        with:
          name: dailymed-v2-master
          path: output/tinysafe_dailymed_v2_master.json
          retention-days: 30

      - name: Upload mineral sunscreen (filtered)
        uses: actions/upload-artifact@v4
        with:
          name: dailymed-v2-mineral-sun
          path: output/tinysafe_dailymed_v2_mineral_sun.json
          retention-days: 30
