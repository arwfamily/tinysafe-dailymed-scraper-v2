name: DailyMed API probe
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'space-separated DailyMed URLs'
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch
        run: |
          mkdir -p data/smoke/api
          i=0
          for u in ${{ github.event.inputs.urls }}; do
            i=$((i+1))
            echo "$u" > "data/smoke/api/$i.url"
            curl -sSL -A "TinySafe-research/1.0 (contact: support@tinysafe.app)" "$u" -o "data/smoke/api/$i.json" || true
            sleep 1
          done
          ls -la data/smoke/api
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/smoke/api
          git diff --cached --quiet && exit 0
          git commit -m "probe: DailyMed API responses"
          git pull --rebase --autostash origin main && git push origin HEAD:main
