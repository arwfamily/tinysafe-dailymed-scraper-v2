name: Thin-label check (fetch SPL text + label images)
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'targets json'
        default: 'data/views/thin_check_targets.json'
      no_images:
        description: 'skip images (true/false)'
        default: 'false'
      branch:
        description: 'output branch'
        default: 'thin-check'
      threads:
        default: '1'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pillow
      - name: Fetch
        run: |
          FLAG=""; [ "${{ inputs.no_images }}" = "true" ] && FLAG="--no-images"
          python scripts/thin_check_fetch.py --targets "${{ inputs.targets }}" --threads "${{ inputs.threads }}" $FLAG
      - name: Push to the thin-check branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv thin_check /tmp/thin_check
          git checkout --orphan thin-check-tmp
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/thin_check .
          git add thin_check
          git commit -qm "thin check $(date -u +%F)"
          git push -f origin thin-check-tmp:${{ inputs.branch }}
