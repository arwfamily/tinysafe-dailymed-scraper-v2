name: Fetch the EU CosIng ingredient register
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download (CSV export, then the public search API, then the open-data portal)
        run: |
          mkdir -p cosing && cd cosing
          UA="Mozilla/5.0 (research; arwhouse.com sunscreen ingredient check)"
          for u in \
            "https://ec.europa.eu/growth/tools-databases/cosing/pdf/COSING_Ingredients-Fragrance%20Inventory_v2.csv" \
            "https://ec.europa.eu/growth/tools-databases/cosing/pdf/COSING_Ingredients-Fragrance Inventory_v2.csv"; do
            curl -sSL -A "$UA" -m 300 -o inventory.csv "$u" -w "%{http_code} $u\n" || true
            if [ -s inventory.csv ] && head -c 2000 inventory.csv | grep -qi "INCI"; then echo OK_CSV; break; fi
            rm -f inventory.csv
          done
          ID=cosmetic-ingredient-database-ingredients-and-fragrance-inventory
          curl -sSL -A "$UA" -m 60 "https://data.europa.eu/api/hub/search/datasets/$ID" -o portal_dataset.json -w "%{http_code} portal\n" || true
          curl -sSL -A "$UA" -m 60 "http://data.europa.eu/88u/dataset/$ID" -o portal_88u.html -w "%{http_code} 88u\n" || true
          grep -oE 'https?://[^" <>\\]+' portal_dataset.json 2>/dev/null | grep -iE 'csv|xls|zip|download|cosing' | sort -u > dist_urls.txt || true
          i=0; while read -r d; do i=$((i+1)); curl -sSL -A "$UA" -m 300 -o "dist_$i.bin" "$d" -w "%{http_code} $d\n" >> dist_log.txt || true; done < dist_urls.txt
          # the CosIng site's own search API (public key embedded in the CosIng web page)
          K=285a77fd-1257-4271-8507-f0c6b2961203
          for pg in 1 2; do
            curl -sS -A "$UA" -m 120 -X POST "https://api.tech.ec.europa.eu/search-api/prod/rest/search?apiKey=$K&text=*&pageSize=200&pageNumber=$pg" \
              -F 'query={"bool":{"must":[{"terms":{"itemType":["ingredient"]}}]}};type=application/json' -o api_p$pg.json -w "%{http_code} api $pg\n" >> dist_log.txt || true
          done
          ls -la | tee listing.txt
      - name: Push to the output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv cosing /tmp/cosing
          git checkout --orphan out-tmp
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/cosing .
          git add cosing
          git commit -qm "cosing $(date -u +%F)"
          git push -f origin out-tmp:cosing-raw
