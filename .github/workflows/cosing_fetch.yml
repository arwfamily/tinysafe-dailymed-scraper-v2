name: Fetch the EU CosIng ingredient register
on:
  workflow_dispatch:
    inputs:
      script:
        default: fetch_cosing.py
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Download every CosIng ingredient record
        run: python scripts/cosing/${{ inputs.script }}
      - name: Push to the output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv cosing /tmp/cosing
          git checkout --orphan out-tmp
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/cosing .
          git add cosing
          git commit -qm "cosing $(date -u +%F)"
          git push -f origin out-tmp:cosing-raw
