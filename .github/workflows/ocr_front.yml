name: OCR front panels (baby/kids words on image-only labels)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr && pip install pillow
      - run: python scripts/label_ocr.py --shard ${{ matrix.shard }} --shards 6
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/views/ocr/shard_${{ matrix.shard }}.jsonl
          git commit -qm "data: OCR front panels shard ${{ matrix.shard }}" || exit 0
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && break; sleep $((RANDOM % 20 + 5)); done
