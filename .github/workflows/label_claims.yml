name: Read label claims (broad spectrum, aging alert)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -q -r requirements.txt 2>/dev/null || true
      - run: python scripts/label_claims.py
      - name: Push to the output branch
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv label_claims /tmp/label_claims
          git checkout --orphan out-tmp
          git rm -rq --cached . 2>/dev/null || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/label_claims .
          git add label_claims
          git commit -qm "label claims $(date -u +%F)"
          git push -f origin out-tmp:label-claims
