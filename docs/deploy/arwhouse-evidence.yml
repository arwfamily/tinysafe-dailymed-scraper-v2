# Copy to arwfamily/arwhouse as .github/workflows/evidence.yml
# Pulls the published evidence + renderer from the public data repo, renders
# /evidence into this repo, commits only when something changed. Vercel then
# deploys arwhouse.com as usual. No secrets needed (data repo is public).
name: Evidence pages
on:
  schedule:
    - cron: '30 13 * * 1'   # Mondays 13:30 UTC, after the data repo's 09:00 run (<=3h)
    - cron: '30 13 * * 2'   # safety re-run in case Monday's data run was late
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Fetch data and renderer
        run: |
          set -e
          RAW=https://raw.githubusercontent.com/arwfamily/tinysafe-dailymed-scraper-v2/main
          mkdir -p "$RUNNER_TEMP/in"
          curl -fsSL "$RAW/site/evidence.json"      -o "$RUNNER_TEMP/in/evidence.json"
          curl -fsSL "$RAW/content/notes.json"      -o "$RUNNER_TEMP/in/notes.json"
          curl -fsSL "$RAW/scripts/render_site.py"  -o "$RUNNER_TEMP/in/render_site.py"
      - name: Render (fails on contract breaks, leaves the live pages untouched)
        run: |
          EVIDENCE_JSON="$RUNNER_TEMP/in/evidence.json" NOTES_JSON="$RUNNER_TEMP/in/notes.json" \
          OUT_DIR="$GITHUB_WORKSPACE/evidence" python -I "$RUNNER_TEMP/in/render_site.py" --check
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/
          git diff --cached --quiet && { echo "no change"; exit 0; }
          git commit -m "evidence: rebuild from data $(date -u +%Y-%m-%d)"
          git push
